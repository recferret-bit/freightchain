<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lobby – Freight Chain</title>
<meta name="robots" content="noindex">   <!-- session-driven; search gets the landing instead (links are still followed) -->
<link rel="canonical" href="https://freightchain.fun/">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0a09">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="site/lobby.css">
</head>
<body>
<header class="top">
  <a class="brand" href="/">⛟ FREIGHT CHAIN</a>
  <div class="chips">
    <span class="chip" id="chip-wallet" title="your wallet"></span>
    <span class="chip" id="chip-free" title="Training rides are unlimited. A weekly granted ticket, when you have one, is shown here until Sunday 12:00 UTC"></span>
    <span class="chip" id="chip-paid" title="paid ride tickets you hold. A live pool can be ridden now; a ticket in a pool that is still filling waits until that pool goes live."></span>
    <span class="chip live" id="chip-live" title="people on the site and trucks on the road right now"></span>
    <span class="lang" role="group" aria-label="language"><button type="button" class="ghost" data-set-lang="en" data-i18n="lang.en">EN</button><button type="button" class="ghost" data-set-lang="ru" data-i18n="lang.ru">RU</button></span>
    <button class="ghost" id="out" data-i18n="lobby.signOut">SIGN OUT</button>
  </div>
</header>
<nav class="tabs" role="tablist" aria-label="Lobby">
  <a role="tab" href="#new" data-tab="new" data-i18n="lobby.tab.new">NEW RIDE</a>
  <a role="tab" href="#live" data-tab="live"><span data-i18n="lobby.tab.live">LIVE</span> <b id="tab-live-n"></b></a>
  <a role="tab" href="#replays" data-tab="replays" data-i18n="lobby.tab.replays">REPLAYS</a>
  <a role="tab" href="#board" data-tab="board" data-i18n="lobby.tab.board">LEADERBOARD</a>
  <a role="tab" href="#achievements" data-tab="achievements" data-i18n="lobby.tab.achievements">ACHIEVEMENTS</a>
  <a role="tab" href="#garage" data-tab="garage" data-i18n="lobby.tab.garage">GARAGE</a>
  <a role="tab" href="#profile" data-tab="profile" data-i18n="lobby.tab.profile">PROFILE</a>
</nav>
<main id="view" aria-live="polite"><p class="dim">Loading…</p></main>
<footer>Devnet build · paid rides use devnet SOL · <a href="/play.html">EASY ride</a></footer>
<script type="module" src="site/lobby.js"></script>
</body>
</html>
