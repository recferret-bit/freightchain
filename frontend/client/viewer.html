<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Freight Chain – Model viewer</title>
<meta name="robots" content="noindex">   <!-- a dev tool on storybook.<apex>: not for search -->
<link rel="canonical" href="https://storybook.freightchain.fun/">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0a09">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="css/amber-glow.css">   <!-- the same yellow hover/press halo as the landing; /css/ is served here, /site/ is not -->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #25282c; color: #d8d4c8; font: 13px/1.35 ui-monospace, Menlo, Consolas, monospace; }
  #world { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  #world:active { cursor: grabbing; }
  #side { position: fixed; top: 0; left: 0; bottom: 0; width: 230px; z-index: 14; overflow-y: auto; background: rgba(20,22,25,.88); border-right: 1px solid #3a3e44; padding: 8px 0 24px; transition: transform .2s ease-out; }
  html.side-closed #side { transform: translateX(-100%); pointer-events: none; }
  #side h1 { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 13px; margin: 0 12px 6px; color: #ffcf5a; letter-spacing: .08em; }
  #side h1 span { margin-right: auto; }
  .pane-tab { display: none; position: fixed; top: 50%; z-index: 16; transform: translateY(-50%); font: inherit; font-size: 11px; letter-spacing: .08em; background: rgba(20,22,25,.92); color: #ffcf5a; border: 1px solid #ffcf5a; padding: 10px 6px; cursor: pointer; }
  #side-show { left: 0; border-left: 0; border-radius: 0 3px 3px 0; }
  #editor-show { right: 0; border-right: 0; border-radius: 3px 0 0 3px; }
  html.side-closed #side-show { display: block; }
  details { margin-top: 4px; } summary { cursor: pointer; padding: 4px 12px; color: #ffcf5a; text-transform: uppercase; font-size: 11px; letter-spacing: .08em; }
  .item { display: block; padding: 3px 12px 3px 22px; cursor: pointer; color: #d8d4c8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item:hover { background: #30343a; } .item.on { background: #3d4c60; color: #fff; }
  #info, #opts { position: fixed; right: 10px; background: rgba(20,22,25,.85); border: 1px solid #3a3e44; border-radius: 4px; padding: 8px 10px; }
  #info { top: 10px; max-width: 280px; } #info b { color: #fff; font-size: 14px; } #info table { border-collapse: collapse; margin-top: 4px; } #info td { padding: 0 8px 0 0; color: #b9ad8d; } #info td+td { color: #d8d4c8; }
  #opts { bottom: 10px; } #opts label { display: block; cursor: pointer; } #opts label.off { opacity: .35; pointer-events: none; }
  /* the model editor (js/editor/): a drawer on the right, desktop only; #info / #opts move left while it is open */
  #editor { display: none; position: fixed; top: 0; right: 0; bottom: 0; width: 420px; z-index: 12; background: rgba(20,22,25,.96); border-left: 1px solid #3a3e44; padding: 8px 10px; box-sizing: border-box; flex-direction: column; gap: 6px; }
  body.editing #editor { display: flex; } #editor [hidden] { display: none !important; }   /* the drawer's flex rows must not override `hidden` */ body.editing #info, body.editing #opts { right: 432px; }
  .ed-head { display: flex; align-items: center; gap: 8px; } .ed-head b { color: #ffcf5a; letter-spacing: .08em; } .ed-who { flex: 1; color: #b9ad8d; } .ed-x { background: none; border: 0; color: #d8d4c8; font-size: 20px; cursor: pointer; }
  .ed-btn { font: inherit; font-size: 11px; background: #30343a; color: #ffcf5a; border: 1px solid #ffcf5a; border-radius: 3px; padding: 4px 9px; cursor: pointer; } .ed-btn:disabled { opacity: .35; cursor: default; } .ed-btn.ed-pub { background: #4a3a10; }
  #ed-toggle { margin-left: 8px; padding: 1px 6px; } .ed-link { background: none; border: 0; color: #7fb0ff; font: inherit; font-size: 11px; cursor: pointer; text-decoration: underline; }
  .ed-tabs { display: flex; gap: 4px; } .ed-tab { flex: 1; font: inherit; font-size: 11px; background: #25282c; color: #b9ad8d; border: 1px solid #3a3e44; padding: 4px; cursor: pointer; } .ed-tab.on { color: #fff; border-color: #ffcf5a; }
  .ed-body { flex: 1; min-height: 0; display: flex; flex-direction: column; } .ed-body > div { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 6px; }
  .ed-row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; } .ed-sel, .ed-in { font: inherit; font-size: 11px; background: #25282c; color: #d8d4c8; border: 1px solid #3a3e44; padding: 3px; } .ed-in { flex: 1; } .ed-newid { flex: 0 0 110px; }
  .ed-log, .ed-revs, .ed-past { overflow-y: auto; border: 1px solid #3a3e44; background: #1b1d20; padding: 4px; } .ed-log { flex: 1; } .ed-revs { flex: 1; } .ed-past { max-height: 22vh; }
  .ed-l { white-space: pre-wrap; margin: 2px 0; } .ed-you { color: #fff; } .ed-ai { color: #d8d4c8; } .ed-tool { color: #7d8187; font-size: 11px; } .ed-sys { color: #b9ad8d; font-size: 11px; } .ed-err, .ed-del { color: #ff8070; } .ed-ok, .ed-okl, .ed-add { color: #8fdc7a; } .ed-warn { color: #ffcf5a; }
  .ed-prompt, .ed-src { font: inherit; font-size: 12px; background: #1b1d20; color: #e8e4d8; border: 1px solid #3a3e44; padding: 6px; resize: vertical; } .ed-src { flex: 1; min-height: 40vh; white-space: pre; tab-size: 2; }
  .ed-item { padding: 4px; border-bottom: 1px solid #2a2d31; cursor: pointer; } .ed-item:hover { background: #30343a; } .ed-item.on { background: #3d4c60; }
  .ed-badge { font-size: 10px; padding: 0 4px; margin-left: 4px; border-radius: 2px; background: #3a3e44; color: #d8d4c8; } .ed-badge.ed-b-head { background: #2f4a7a; } .ed-live, .ed-done { background: #2e6b2e !important; } .ed-failed, .ed-cancelled { background: #7a2f2f !important; } .ed-running, .ed-queued { background: #7a5a14 !important; }
  .ed-dim { color: #7d8187; font-size: 11px; } .ed-sub { color: #ffcf5a; font-size: 10px; letter-spacing: .08em; } .ed-msg { min-height: 1.3em; color: #8fdc7a; font-size: 11px; } .ed-msg.bad { color: #ff8070; } .ed-entity { color: #d8d4c8; }
  .ed-diff { max-height: 30vh; overflow: auto; margin: 0; font-size: 11px; background: #1b1d20; border: 1px solid #3a3e44; padding: 4px; } .ed-out { max-height: 18vh; overflow: auto; font-size: 11px; } .ed-signin p { color: #b9ad8d; }
  .ed-work { display: flex; align-items: center; gap: 8px; min-height: 16px; }
  .ed-work-label { color: #b9ad8d; font-size: 11px; letter-spacing: .08em; }
  .ed-work-track { position: relative; flex: 1; height: 2px; background: #2a2d31; overflow: hidden; border-radius: 1px; }
  .ed-work-bar { position: absolute; left: 0; top: 0; height: 100%; width: 35%; background: #ffcf5a; animation: ed-work 1.15s ease-in-out infinite; }
  @keyframes ed-work { from { transform: translateX(-120%); } to { transform: translateX(340%); } }
  @media (prefers-reduced-motion: reduce) { .ed-work-bar { animation: none; width: 100%; opacity: .55; } }
  @media (min-width: 701px) { html.editor-ready body:not(.editing) #editor-show { display: block; } }
  @media (max-width: 700px) {
    #side { width: 220px; max-width: 80vw; z-index: 15; box-shadow: 4px 0 20px rgba(0,0,0,.6); }
    html.side-closed #side { box-shadow: none; }
    #editor-show { display: none !important; }
    #help { display: none; }
    #info { top: 10px; right: 10px; max-width: 170px; font-size: 11px; padding: 6px 8px; z-index: 5; }
    #info b { font-size: 12px; }
    #opts { bottom: 10px; right: 10px; font-size: 11px; padding: 6px 8px; z-index: 5; }
    #ed-toggle, body.editing #editor { display: none; }   /* the editor is a desktop tool */
  }
</style>
<script>if (matchMedia('(max-width:700px)').matches) document.documentElement.classList.add('side-closed');</script>
</head>
<body>
<canvas id="world"></canvas>
<button id="side-show" type="button" class="pane-tab" aria-controls="side" aria-expanded="false" aria-label="Show the model list">SHOW</button>
<button id="editor-show" type="button" class="pane-tab" aria-controls="editor" aria-expanded="false" aria-label="Show the editor">SHOW</button>
<div id="side"><h1><span>MODEL VIEWER</span><button id="side-hide" type="button" class="ed-btn" aria-controls="side" aria-expanded="true" aria-label="Hide the model list">HIDE</button></h1><div id="list"></div></div>
<div id="info"></div>
<div id="opts"></div>
<div id="help">right-drag = orbit · left-drag = pan · wheel / pinch = zoom · WASD = strafe · ←/→ = prev/next · F = re-frame · Space = auto-rotate · E edges · G grid · X box · V wireframe</div>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module" src="js/viewer.js"></script>
<script>
  const setSide = open => {
    document.documentElement.classList.toggle('side-closed', !open);
    document.getElementById('side')?.setAttribute('aria-hidden', open ? 'false' : 'true');
    document.getElementById('side-show')?.setAttribute('aria-expanded', String(open));
    document.getElementById('side-hide')?.setAttribute('aria-expanded', String(open));
  };
  setSide(!document.documentElement.classList.contains('side-closed'));
  document.getElementById('side-hide')?.addEventListener('click', () => setSide(false));
  document.getElementById('side-show')?.addEventListener('click', () => setSide(true));
  document.getElementById('list')?.addEventListener('click', e => {
    if (e.target.classList.contains('item') && matchMedia('(max-width: 700px)').matches) setSide(false);
  });
  setTimeout(() => { if (!window.__viewer) document.getElementById('info').innerHTML = '<b>COULD NOT START</b><br>Serve this folder over http (<b>./serve.sh</b>, then open <b>/viewer.html</b>) – ES modules do not load from file://. Needs internet for three.js.'; }, 8000);
</script>
</body>
</html>
