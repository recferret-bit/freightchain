<body>
<canvas id="world"></canvas>
<canvas id="cockpit"></canvas>
<div id="toast"></div>
<div id="overlay" class="booting"><div class="panel" id="boot"><h1>LOADING</h1><h2 id="boot-sub">Getting the road ready…</h2><div class="loadbar"><i id="boot-fill"></i></div></div><div class="panel" id="panel"></div></div>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module" src="js/main.js"></script>
<script>
  // If the modules didn't start (typically: index.html opened straight from disk, or no internet for three.js), say so instead of showing a blank page.
  // Loading screen: a dummy bar that eases towards 90 %, shown for at least MIN ms even when everything is cached; it jumps to 100 % and hands over to the menu once the game has started.
  const t0 = performance.now(), MIN = 1200, fill = document.getElementById('boot-fill'), ov = document.getElementById('overlay');
  const done = () => { fill.style.width = '100%'; setTimeout(() => ov.classList.remove('booting'), 250); };
  (function tick() {
    const t = performance.now() - t0;
    if (window.__game && t >= MIN) return done();
    if (ov.dataset.failed) return;   // the COULD NOT START panel below took over
    fill.style.width = Math.min(90, 90 * (1 - Math.exp(-t / 700))) + '%';
    requestAnimationFrame(tick);
  })();
  setTimeout(() => {
    if (window.__game) return;
    ov.dataset.failed = '1'; ov.classList.remove('booting');
    document.getElementById('panel').innerHTML = '<h1>COULD NOT START</h1><h2>The game scripts did not load.</h2>' +
      '<div style="margin:6px 0;font-size:15px">Browsers block ES modules on <b>file://</b>. Either:</div>' +
      '<table><tr><td>A</td><td>run <b>python3 -m http.server 8765</b> in this folder and open <b>http://localhost:8765/</b></td></tr>' +
      '<tr><td>B</td><td>run <b>node tools/build-standalone.mjs</b> and double-click <b>dist/freightchain.html</b></td></tr></table>' +
      '<div style="font-size:12px;color:#b9ad8d">three.js is loaded from a CDN, so an internet connection is also required.</div>';
  }, 2000);
</script>
</body>
</html>
