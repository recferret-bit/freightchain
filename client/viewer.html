<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Freight Chain – Model viewer</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0a09">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #25282c; color: #d8d4c8; font: 13px/1.35 ui-monospace, Menlo, Consolas, monospace; }
  #world { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  #world:active { cursor: grabbing; }
  #side { position: fixed; top: 0; left: 0; bottom: 0; width: 230px; overflow-y: auto; background: rgba(20,22,25,.88); border-right: 1px solid #3a3e44; padding: 8px 0 24px; }
  #side h1 { font-size: 13px; margin: 0 12px 6px; color: #ffcf5a; letter-spacing: .08em; }
  details { margin-top: 4px; } summary { cursor: pointer; padding: 4px 12px; color: #ffcf5a; text-transform: uppercase; font-size: 11px; letter-spacing: .08em; }
  .item { display: block; padding: 3px 12px 3px 22px; cursor: pointer; color: #d8d4c8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item:hover { background: #30343a; } .item.on { background: #3d4c60; color: #fff; }
  #info, #opts { position: fixed; right: 10px; background: rgba(20,22,25,.85); border: 1px solid #3a3e44; border-radius: 4px; padding: 8px 10px; }
  #info { top: 10px; max-width: 280px; } #info b { color: #fff; font-size: 14px; } #info table { border-collapse: collapse; margin-top: 4px; } #info td { padding: 0 8px 0 0; color: #b9ad8d; } #info td+td { color: #d8d4c8; }
  #opts { bottom: 10px; } #opts label { display: block; cursor: pointer; } #opts label.off { opacity: .35; pointer-events: none; }
  #help { position: fixed; left: 240px; right: 230px; bottom: 8px; color: #7d8187; font-size: 11px; }
  @media (max-width: 700px) { #side { width: 150px; } #help { display: none; } #info { max-width: 160px; } }
</style>
</head>
<body>
<canvas id="world"></canvas>
<div id="side"><h1>MODEL VIEWER</h1><div id="list"></div></div>
<div id="info"></div>
<div id="opts"></div>
<div id="help">right-drag = orbit · left-drag = pan · wheel / pinch = zoom · WASD = strafe · ←/→ = prev/next · F = re-frame · Space = auto-rotate · E edges · G grid · X box · V wireframe</div>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module" src="js/viewer.js"></script>
<script>
  setTimeout(() => { if (!window.__viewer) document.getElementById('info').innerHTML = '<b>COULD NOT START</b><br>Serve this folder over http (<b>./serve.sh</b>, then open <b>/viewer.html</b>) – ES modules do not load from file://. Needs internet for three.js.'; }, 2000);
</script>
</body>
</html>
