<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lobby – Freight Chain</title>
<meta name="robots" content="noindex">   <!-- session-driven; search gets the landing instead (links are still followed) -->
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0a09">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="site/lobby.css">
</head>
<body>
<header class="top">
  <a class="brand" href="/">⛟ FREIGHT CHAIN</a>
  <div class="chips">
    <span class="chip" id="chip-wallet" title="your wallet"></span>
    <span class="chip" id="chip-free" title="free rides: 10 at signup, daily refill stops at 5. A surplus stays. The timer counts down to the next +1"></span>
    <span class="chip" id="chip-paid" title="paid ride tickets you hold. A live pool can be ridden now; a ticket in a pool that is still filling waits until that pool goes live."></span>
    <span class="chip live" id="chip-live" title="people on the site and trucks on the road right now"></span>
    <button class="ghost" id="out">SIGN OUT</button>
  </div>
</header>
<nav class="tabs" role="tablist" aria-label="Lobby">
  <a role="tab" href="#new" data-tab="new">NEW RIDE</a>
  <a role="tab" href="#live" data-tab="live">LIVE <b id="tab-live-n"></b></a>
  <a role="tab" href="#replays" data-tab="replays">REPLAYS</a>
  <a role="tab" href="#board" data-tab="board">LEADERBOARD</a>
  <a role="tab" href="#achievements" data-tab="achievements">ACHIEVEMENTS</a>
  <a role="tab" href="#garage" data-tab="garage">GARAGE</a>
  <a role="tab" href="#profile" data-tab="profile">PROFILE</a>
</nav>
<main id="view" aria-live="polite"><p class="dim">Loading…</p></main>
<footer>Devnet build · paid rides use devnet SOL · <a href="/play.html">offline practice</a></footer>
<script type="module" src="site/lobby.js"></script>
</body>
</html>
