# http-level zones for the 3D model API (docs/agents/editor.md). Installed as /etc/nginx/conf.d/freightchain-limits.conf by deploy/scripts/remote/setup.sh
# (rewritten on every setup). Used by the /api/entities/ snippet (api.<apex> and storybook.<apex>) and the editor location on storybook.<apex>.
#   fc_entities  the bundle every page loads once: 5 req/s per IP, short bursts
#   fc_editor    the model editor: 10 req/s per IP (it polls its jobs about once a second)
#   fc_conn      at most 20 open connections per IP on those locations
#   fc_entities_cache  30 s microcache of the bundle (Cache-Control: public, max-age=60 from the app); the app holds it in memory anyway
limit_req_zone $binary_remote_addr zone=fc_entities:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=fc_editor:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=fc_conn:10m;
limit_req_status 429;
limit_conn_status 429;
proxy_cache_path /var/cache/nginx/freightchain_entities levels=1:2 keys_zone=fc_entities_cache:2m max_size=32m inactive=10m use_temp_path=off;
