<svg xmlns="http://www.w3.org/2000/svg" width="720" height="228" viewBox="0 0 720 228" role="img" aria-label="A pool splits 70 percent prizes, 20 percent next seed, 10 percent fee. Inside the prize share the top three take 25, 15 and 10 parts, and 20 parts are shared by ranks 1 to 20.">
  <rect width="720" height="228" rx="12" fill="#14110e"/>
  <text x="24" y="32" fill="#e8e2cf" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="700">One pool, integer lamports, floors only</text>
  <text x="24" y="52" fill="#9d957f" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12">Default the operator scripts pass: 7000 / 2000 / 1000. The program stores the bps on the pool. It does not hard-code the ranks.</text>
  <rect x="24" y="72" width="470" height="36" rx="6" fill="#ffcf5a"/>
  <rect x="494" y="72" width="134" height="36" rx="6" fill="#14f195"/>
  <rect x="628" y="72" width="68" height="36" rx="6" fill="#9945ff"/>
  <text x="259" y="95" text-anchor="middle" fill="#14110e" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700">prizes 70%</text>
  <text x="561" y="95" text-anchor="middle" fill="#14110e" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="700">seed 20%</text>
  <text x="662" y="95" text-anchor="middle" fill="#fff" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" font-weight="700">fee</text>
  <text x="24" y="132" fill="#9d957f" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12">Inside the prize share, 70 parts. Top 3 also take a slice of the 20.</text>
  <rect x="24" y="146" width="168" height="28" rx="4" fill="#ffcf5a"/>
  <rect x="196" y="146" width="100" height="28" rx="4" fill="#e2b84a"/>
  <rect x="300" y="146" width="68" height="28" rx="4" fill="#c9a24a"/>
  <rect x="372" y="146" width="134" height="28" rx="4" fill="#3a342c"/>
  <text x="108" y="165" text-anchor="middle" fill="#14110e" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="700">1st · 25</text>
  <text x="246" y="165" text-anchor="middle" fill="#14110e" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="700">2nd · 15</text>
  <text x="334" y="165" text-anchor="middle" fill="#14110e" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="700">3rd · 10</text>
  <text x="439" y="165" text-anchor="middle" fill="#e8e2cf" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12">20 · ranks 1–20</text>
  <text x="24" y="198" fill="#9d957f" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12">A full 20-ticket hour at $5: 1st $26, 2nd $16, 3rd $11, places 4–20 $1. Unpaid lamports stay in the vault and go to the seed treasury at close.</text>
  <text x="24" y="216" fill="#9d957f" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12">The devnet series on the site is a short test schedule, so the pool you open may not be this $5 example.</text>
</svg>
