<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Freight Chain · Dash</title>
<link rel="icon" href="assets/icon.png">
<link rel="stylesheet" href="deck-base.css">
<style>
/* Option A · DASH – the landing's cab: dash blacks, amber gear digit, needle orange, LCD green, all mono. */
:root{--bg:#0b0a09;--panel:#17130f;--ink:#e8e2cf;--muted:#9d957f;--accent:#ffcf5a;--accent2:#ff7a2e;--good:#7cff7c;--line:#4a453b}
#stage{background:radial-gradient(ellipse at 70% 40%,#1d1710 0%,#0b0a09 60%)}
#stage::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:15;background:repeating-linear-gradient(0deg,#0000 0 3px,#0000000f 3px 4px)}
.ticker{position:absolute;left:0;right:0;top:0;height:40px;z-index:16;background:#0d2410;border-bottom:1px solid #1e4a22;color:#7cff7c;font:500 18px/40px ui-monospace,monospace;letter-spacing:2px;white-space:nowrap;overflow:hidden;text-shadow:0 0 8px #7cff7c66}
.ticker div{display:inline-block;animation:tk 40s linear infinite}
.ticker span{padding:0 36px}
.ticker span::before{content:"◆";margin-right:36px;opacity:.5;font-size:12px}
@keyframes tk{to{transform:translateX(-50%)}}
.slide{padding-top:120px}
.shot{border:1px solid #ffcf5a55;box-shadow:0 0 0 1px #000,0 30px 80px #000c,0 0 60px #ffb02e22}
.lbl::before{content:"▮ ";color:var(--accent)}
h1{text-shadow:0 0 40px #ffb02e33}
.L-chart .stats b,.L-money .split b{text-shadow:none}
.stats div{background:#0d0b09cc}
.stats .hot{border-color:var(--accent2)}
.stats div:first-child b{color:var(--good);text-shadow:0 0 18px #7cff7c55}
.charts section{background:#0d0b09cc}
.cta{box-shadow:0 0 40px #ffb02e55}
.tags span{background:#0d2410;color:var(--good);border-color:#1e4a22}
</style>
</head>
<body>
<div id="stage">
<div class="ticker"><div><span>SOLANA DEVNET</span><span>10 FREE RIDES</span><span>NO DOWNLOAD</span><span>ESCROWED ON SOLANA</span><span>WE NEVER HOLD THE FUNDS</span><span>NO TOKEN</span><span>FREIGHTCHAIN.FUN</span><span>SOLANA DEVNET</span><span>10 FREE RIDES</span><span>NO DOWNLOAD</span><span>ESCROWED ON SOLANA</span><span>WE NEVER HOLD THE FUNDS</span><span>NO TOKEN</span><span>FREIGHTCHAIN.FUN</span></div></div>
<div id="deck"></div><div id="bar"></div></div>
<div id="notes"><span id="clock"></span><div id="notes-text"></div><div id="notes-warn"></div></div>
<div id="tip" hidden></div>
<div id="help">← → · F full screen · N script · P play to the clock</div>
<script src="deck.js"></script>
</body>
</html>
