<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Freight Chain · Trip Sheet</title>
<link rel="icon" href="assets/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Special+Elite&family=IBM+Plex+Mono:wght@500;600;700&display=swap">
<link rel="stylesheet" href="deck-base.css">
<style>
/* Option C · TRIP SHEET – the landing roadmap's driver's log: ruled cream paper, typewriter ink, rubber stamps, taped photos. */
:root{--bg:#ece4d0;--panel:#f6f0e1;--ink:#1d1a16;--muted:#6d6555;--accent:#1d1a16;--accent2:#c2410c;--good:#2f7a3a;--line:#c9bea4;
  --head:"Special Elite","Courier New",monospace;--body:"IBM Plex Mono",ui-monospace,monospace;--radius:2px}
#stage{background:repeating-linear-gradient(0deg,#0000 0 53px,#c9bea455 53px 54px),linear-gradient(90deg,#0000 0 150px,#c2410c33 150px 152px,#0000 152px),#ece4d0}
#stage::before{content:"FREIGHT CHAIN · TRIP SHEET · UNIT FC-01 · DRIVER: SOLO · DESTINATION: MAINNET";position:absolute;left:180px;top:40px;font:600 16px var(--body);letter-spacing:4px;color:var(--muted);z-index:5}
.slide{padding-left:200px}
h1{color:var(--ink);font:400 100px/1.02 var(--head);letter-spacing:0}
h1 em{color:var(--accent2)}
.lbl{display:inline-block;transform:rotate(-2deg);border:3px solid var(--accent2);border-radius:6px;padding:8px 16px;color:var(--accent2);font:700 22px var(--body);letter-spacing:5px}
.pts li{font:500 27px/1.3 var(--body)}
.pts li::before{content:"☑";background:none;width:auto;height:auto;top:0;color:var(--good);font-size:30px;line-height:1.3}
.pts b{color:var(--accent2)}
.shot{border-radius:2px;border:14px solid #fffdf6;box-shadow:0 18px 40px #3a2e1a55;overflow:visible}
.shot img,.shot video{position:relative}
.shot::before{content:"";position:absolute;z-index:3;left:50%;top:-24px;width:150px;height:38px;margin-left:-75px;background:#f3e3a3cc;transform:rotate(-3deg);box-shadow:0 2px 4px #0002}
.shot{overflow:hidden}
.L-wall .shot,.L-split .shot,.L-money .shot,.L-end .shot,.L-bleed .poster{overflow:hidden}
.L-bleed{background:#1d1a16}
.L-bleed .shade{background:linear-gradient(90deg,#1d1a16f0 0%,#1d1a16aa 45%,#0000 78%)}
.L-bleed h1,.L-bleed .pts li{color:#f6f0e1}
.L-bleed h1 em{color:#ffb88a}
.brand{color:var(--ink)}
.tags span{background:#fffdf6;color:var(--ink);border:2px dashed var(--ink);border-radius:4px}
.badge.live{background:var(--accent2);transform:rotate(3deg);border-radius:4px}
.ladder li{border-color:var(--line);background:#f6f0e1aa}
.ladder li.on{border:3px solid var(--good)}
.ladder li.on b{color:var(--good)}
.split div:nth-child(1){background:var(--ink);color:#f6f0e1}
.split div:nth-child(2){background:var(--accent2);color:#fff}
.split div:nth-child(3){background:#b8ad94;color:var(--ink)}
.split b{font:400 46px/1 var(--head)}
.fine{display:inline-block;color:var(--accent2);border:3px solid var(--accent2);padding:8px 14px;transform:rotate(-1.5deg);border-radius:4px}
.stats div{background:#fffdf6;border:2px dashed var(--line)}
.stats b{font:400 84px/1 var(--head);color:var(--ink)}
.stats .hot{border:3px solid var(--accent2)}
.stats .hot b{color:var(--accent2)}
.charts section{background:#fffdf6;border:2px dashed var(--line)}
.c-bar{fill:#2b2620}.c-track{fill:#c9bea4}
.road li{font:400 42px var(--head)}
.road b{color:var(--accent2)}
.cta{background:var(--ink);color:#f6f0e1;border-radius:4px;font:400 48px var(--head)}
.num{color:var(--muted)}
#bar{background:var(--accent2)}
.glyph{display:none}
</style>
</head>
<body>
<div id="stage"><div id="deck"></div><div id="bar"></div></div>
<div id="notes"><span id="clock"></span><div id="notes-text"></div><div id="notes-warn"></div></div>
<div id="tip" hidden></div>
<div id="help">← → · F full screen · N script · P play to the clock</div>
<script src="deck.js"></script>
</body>
</html>
