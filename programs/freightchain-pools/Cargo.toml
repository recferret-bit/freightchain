[workspace]
members = [
    "programs/*"
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.89.0"

# solana-verify picks its Docker image from this (else from Cargo.lock: solana-account-info 3.1.1 -> the wrong 3.1.1 image).
# Keep it equal to the local solana CLI the program is built and tested with.
[workspace.metadata.cli]
solana = "4.1.2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
