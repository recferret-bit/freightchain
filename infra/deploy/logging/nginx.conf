# Server-level inclusion prevents inheritance of the host's shared access/error logs.
access_log syslog:server=unix:/run/systemd/journal.freightchain/dev-log,facility=local7,tag=fc_nginx_access,nohostname combined;
error_log syslog:server=unix:/run/systemd/journal.freightchain/dev-log,facility=local7,tag=fc_nginx_error,nohostname warn;
